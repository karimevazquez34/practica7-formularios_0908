<!DOCTYPE html> <!-- Tipo de archivo HTML5 -->
<html lang="en"> <!-- Definición del idioma del documento -->
<head> <!-- Bloque de metadatos de la página -->
<meta charset="UTF-8"> <!-- Juego de caracteres universales -->
<meta name="viewport" content="width=device-width, initial-scale $=1.0^{\prime\prime}>$ <!-- Adaptación a la pantalla del dispositivo -->
<title>Formularios en HTML - Radiobotón</title> <!-- Título en la pestaña -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"> <!-- Carga de biblioteca de íconos -->
</head> <!-- Cierre de la cabecera -->
<body> <!-- Inicio del cuerpo del archivo -->
<h2>Formularios con Radioboton</h2> <!-- Título de la sección -->
<form action="" method="post"> <!-- Formulario con envío POST -->
Ingresa tu nombre: <!-- Etiqueta de texto de campo -->
<input type="text" name="nombre"> <!-- Entrada de texto para el nombre del usuario -->
<br> <!-- Salto de renglón -->
Selecciona el maximo de estudios que tienes: <!-- Indicación de la encuesta -->
<br> <!-- Salto de renglón -->
<input type="radio" name="estudios" value="1">Sin estudios <br> <!-- Botón de opción circular excluyente del grupo "estudios" (valor 1) -->
<input type="radio" name="estudios" value="2">Primaria <br> <!-- Botón de opción exclusivo del grupo "estudios" (valor 2) -->
<input type="radio" name="estudios" value="3">Secundaria <br> <!-- Botón de opción exclusivo del grupo "estudios" (valor 3) -->
<input type="radio" name="estudios" value="4">Preparatoria <br> <!-- Botón de opción exclusivo del grupo "estudios" (valor 4) -->
<input type="submit" value="enviar"> <!-- Botón de enviar formulario -->
<input type="reset" value="borrar"> <!-- Botón de restablecimiento de campos -->
</form> <!-- Cierre del formulario -->
</body> <!-- Cierre de body -->
</html> <!-- Cierre de html -->
