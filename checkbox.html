<!DOCTYPE html> <!-- Declaración del estándar HTML5 -->
<html lang="en"> <!-- Define el idioma predeterminado del documento -->
<head> <!-- Cabecera para datos de configuración -->
<meta charset="UTF-8"> <!-- Codificación de texto general UTF-8 -->
<meta name="viewport" content="width=device-width, initial-scale $=1.0^{\prime\prime}>$ <!-- Vista adaptable a dispositivos -->
<title>Formularios en HTML - Checkbox</title> <!-- Título del documento en el navegador -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"> <!-- Enlace a íconos Font Awesome -->
</head> <!-- Cierre de cabecera -->
<body> <!-- Inicio del cuerpo del HTML -->
<h2>Formularios con checkbox</h2> <!-- Título secundario de la página -->
<form action="" method="post"> <!-- Creación de formulario con envío de información vía POST -->
Ingresa tu nombre: <!-- Etiqueta simple de texto -->
<input type="text" name="nombre"> <!-- Caja para entrada de texto breve -->
<br> <!-- Salto de renglón -->
Selecciona los lenguajes que conozcas: <!-- Instrucción para las casillas de selección -->
<br> <!-- Salto de renglón -->
<input type="checkbox" name="Java">Java <br> <!-- Casilla independiente seleccionable para la opción Java con salto de línea -->
<input type="checkbox" name="Python"> Python <br> <!-- Casilla independiente seleccionable para la opción Python -->
<input type="checkbox" name="C#">C# <br> <!-- Casilla independiente seleccionable para la opción C# -->
<input type="checkbox" name="Flutter"> Flutter <br> <!-- Casilla independiente seleccionable para la opción Flutter -->
</form> <!-- Cierre del contenedor de formulario -->
</body> <!-- Cierre del body -->
</html> <!-- Cierre del elemento html -->
