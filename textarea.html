<!DOCTYPE html> <!-- Especificación del tipo de documento HTML5 -->
<html lang="en"> <!-- Define el idioma raíz como inglés -->
<head> <!-- Metadatos e información de la cabecera -->
<meta charset="UTF-8"> <!-- Define el mapa de caracteres UTF-8 -->
<meta name="viewport" content="width=device-width, initial-scale $=1.0^{\prime\prime}>$ <!-- Escala adaptable a pantallas -->
<title>Formularios en HTML - Text Area</title> <!-- Título en la pestaña -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"> <!-- Estilos de íconos -->
</head> <!-- Cierre del head -->
<body> <!-- Contenido visible del documento -->
<h2>Formulario con text area</h2> <!-- Título del formulario -->
<form action="" method="post"> <!-- Formulario configurado con envío POST -->
Ingresa tu nombre: <!-- Texto para indicar el campo de nombre -->
<input type="text" name="nombre"> <!-- Campo de texto de una sola línea -->
<br> <!-- Salto de línea -->
Ingresa tu correo: <!-- Texto para indicar el correo -->
<input type="email" name="correo"> <!-- Campo especializado que valida que el texto tenga estructura de e-mail -->
<br> <!-- Salto de línea -->
Ingresa tus comentarios: <!-- Texto descriptivo para los comentarios -->
<textarea name="comentarios" rows $=^{\prime\prime}1^{\prime\prime}$ cols="10"></textarea> <!-- Campo multilínea para escribir párrafos extensos (definido con filas y columnas) -->
<br> <!-- Salto de línea -->
<input type="submit" value="enviar"> <!-- Botón para procesar y mandar los datos -->
<input type="reset" value="borrar"> <!-- Botón para reiniciar/limpiar los datos ingresados -->
</form> <!-- Cierre del formulario -->
</body> <!-- Cierre del body -->
</html> <!-- Cierre de la etiqueta html -->
