<!DOCTYPE html> <!-- Declara el documento HTML5 -->
<html lang="en"> <!-- Idioma del documento en inglés -->
<head> <!-- Contenedor de metadatos -->
<meta charset="UTF-8"> <!-- Codificación de caracteres estándar -->
<meta name="viewport" content="width=device-width, initial-scale $=1.0^{\prime\prime}>$ <!-- Ajuste de escala para pantallas de móviles -->
<title>Formularios en HTML - Contraseñas</title> <!-- Título de la pestaña web -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"> <!-- Carga de la fuente de íconos -->
</head> <!-- Cierre del encabezado -->
<body> <!-- Inicio del cuerpo de la página -->
<h2>Formulario para contraseñas</h2> <!-- Título de la sección -->
<form action="" method="post"> <!-- Formulario que procesa datos por método POST -->
Ingresa tu usuario: <!-- Etiqueta de texto para el campo de usuario -->
<input type="text" name="usuario"> <!-- Campo de texto común para escribir el nombre de usuario -->
Ingresa tu contraseña: <!-- Etiqueta de texto para la clave -->
<input type="password" name="pass"> <!-- Campo tipo contraseña que enmascara/oculta los caracteres escritos -->
<br> <!-- Salto de línea para bajar los botones -->
<input type="submit" value="enviar"> <!-- Botón para enviar el formulario al servidor -->
<input type="reset" value="borrar"> <!-- Botón que borra todo el contenido escrito en los campos -->
</form> <!-- Cierre del formulario -->
</body> <!-- Cierre del cuerpo -->
</html> <!-- Cierre del HTML -->
