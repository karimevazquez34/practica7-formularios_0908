<!DOCTYPE html> <!-- Estructura HTML5 -->
<html lang="en"> <!-- Declaración de idioma del sitio -->
<head> <!-- Encabezado de la página -->
<meta charset="UTF-8"> <!-- Formato de caracteres de texto -->
<meta name="viewport" content="width=device-width, initial-scale $=1.0^{\prime\prime}>$ <!-- Responsividad de pantalla -->
<title>Formularios en HTML - Botones</title> <!-- Título de la ventana -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"> <!-- Importa Font Awesome para usar íconos -->
</head> <!-- Cierre del encabezado -->
<body> <!-- Inicio del cuerpo del documento -->
<h2>Formulario con botones</h2> <!-- Título secundario de la página -->
<form action="" method="post"> <!-- Contenedor de formulario con método POST -->
Ingresa tu nombre: <!-- Texto descriptivo -->
<input type="text" name="nombre"> <!-- Caja para escribir texto -->
<br> <!-- Salto de renglón -->
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button> <!-- Botón interactivo para enviar, con ícono de un avión de papel dentro -->
<button type="reset">Borrar <i class="fa fa-trash"></i></button> <!-- Botón interactivo para limpiar, con ícono de una papelera de reciclaje dentro -->
</form> <!-- Cierre del formulario -->
</body> <!-- Cierre del body -->
</html> <!-- Cierre de etiquetas HTML -->
