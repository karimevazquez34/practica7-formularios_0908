<!DOCTYPE html> <!-- Estándar HTML5 -->
<html lang="en"> <!-- Configuración de idioma principal -->
<head> <!-- Datos informativos para el navegador -->
<meta charset="UTF-8"> <!-- Codificación UTF-8 para símbolos y acentos -->
<meta name="viewport" content="width=device-width, initial-scale $=1.0^{\prime\prime}>$ <!-- Vista escalable para móviles -->
<title>Formularios en HTML - Selección</title> <!-- Título de pestaña -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"> <!-- Estilos de íconos externos -->
</head> <!-- Cierre de head -->
<body> <!-- Contenido editable de la página -->
<h2>Formularios con seleccion</h2> <!-- Título de sección -->
<form action="" method="post"> <!-- Formulario que recopila y envía datos por POST -->
Ingresa tu nombre: <!-- Texto informativo -->
<input type="text" name="nombre"> <!-- Entrada estándar para nombre -->
<br> <!-- Salto de línea -->
Selecciona tu pais: <!-- Texto de instrucción -->
<select name="pais"> <!-- Menú desplegable para seleccionar una opción -->
<option value="1">Argentina</option> <!-- Opción 1 dentro de la lista con valor enviado "1" -->
<option value="2">España</option> <!-- Opción 2 dentro de la lista desplegable -->
<option value="3">Mexico</option> <!-- Opción 3 dentro de la lista desplegable -->
<option value="4">Guatemala</option> <!-- Opción 4 dentro de la lista desplegable -->
<option value="5">Honduras</option> <!-- Opción 5 dentro de la lista desplegable -->
<option value="6">El Salvador</option> <!-- Opción 6 dentro de la lista desplegable -->
<option value="7">Venezuela</option> <!-- Opción 7 dentro de la lista desplegable -->
<option value="8">Colombia</option> <!-- Opción 8 dentro de la lista desplegable -->
</select> <!-- Cierre del menú desplegable -->
<br> <!-- Salto de línea -->
<input type="submit" value="enviar"> <!-- Botón para enviar datos -->
<input type="reset" value="borrar"> <!-- Botón para vaciar/reiniciar selección -->
</form> <!-- Cierre de etiqueta form -->
</body> <!-- Cierre de body -->
</html> <!-- Cierre de documento HTML -->
